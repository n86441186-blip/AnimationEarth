<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimationEarth</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000;
    }

    /* Background */
    .bg {
        background: url("explosion.jpeg");
        background-size: cover;
        background-position: center;
        min-height: 100vh;
        padding: 20px;
    }

    /* Main container */
    .overlay {
        background: rgba(255,255,255,0.90);
        max-width: 1300px;
        margin: 0 auto;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        position: relative;
    }

    /* Top buttons */
    .top-buttons {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 12px;
    }

    .top-buttons button {
        background: #b00000;
        color: #fff;
        padding: 10px 18px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.95em;
    }

    /* Logo */
    header {
        text-align: center;
        margin-top: 20px;
    }

    header img {
        width: 240px;
        border-radius: 16px;
    }

    /* Search bar */
    #searchBar {
        width: 90%;
        max-width: 600px;
        padding: 14px;
        margin: 30px auto;
        display: block;
        border-radius: 999px;
        border: 2px solid #b00000;
        font-size: 1.1em;
    }

    /* Section titles */
    h2 {
        margin-top: 40px;
        margin-bottom: 15px;
        font-size: 1.6em;
        color: #b00000;
        font-weight: bold;
    }

    /* Horizontal scroll rows */
    .scroll-box {
        display: flex;
        overflow-x: auto;
        gap: 16px;
        padding-bottom: 15px;
    }

    /* Content tiles */
    .item {
        min-width: 200px;
        height: 120px;
        background-size: cover;
        background-position: center;
        border-radius: 18px;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        color: #fff;
        font-size: 1em;
        padding-bottom: 10px;
        text-shadow: 0 0 8px #000;
        font-weight: bold;
    }

    /* Modal backdrop */
    .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    /* Modal box */
    .modal {
        background: #fff;
        border-radius: 20px;
        max-width: 550px;
        width: 90%;
        padding: 25px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        position: relative;
    }

    .modal-close {
        position: absolute;
        top: 12px;
        right: 12px;
        border: none;
        background: transparent;
        font-size: 1.4em;
        cursor: pointer;
    }

    .modal-thumb {
        width: 100%;
        height: 200px;
        border-radius: 18px;
        background-size: cover;
        background-position: center;
        margin-bottom: 20px;
        cursor: pointer;
    }

    .modal-actions {
        display: none;
    }

    .btn {
        display: block;
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-size: 1.05em;
    }

    .btn-play { background: #b00000; color: #fff; }
    .btn-trailer { background: #444; color: #fff; }
    .btn-rate { background: #ffd700; color: #000; }

    /* Login modal */
    .login-input {
        width: 100%;
        padding: 12px;
        margin-bottom: 14px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 1em;
    }
</style>
</head>
<body>

<div class="bg">
    <div class="overlay">

        <div class="top-buttons">
            <button id="createAccountBtn">Create Account</button>
            <button id="signInBtn">Sign In</button>
        </div>

        <header>
            <img src="logo.png" alt="Logo">
        </header>

        <input type="text" id="searchBar" placeholder="Search...">

        <!-- SECTION ORDER (you can rearrange these) -->
        <h2>Shorts</h2>
        <div class="scroll-box" id="shortsRow"></div>

        <h2>Shows</h2>
        <div class="scroll-box" id="showsRow"></div>

        <h2>For You</h2>
        <div class="scroll-box" id="forYouRow"></div>

    </div>
</div>

<!-- Content Modal -->
<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-thumb" id="modalThumb"></div>
        <div class="modal-desc" id="modalDesc"></div>
        <div class="modal-actions" id="modalActions">
            <button class="btn btn-play">Play</button>
            <button class="btn btn-trailer">Trailer</button>
            <button class="btn btn-rate">Rate ⭐</button>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div class="modal-backdrop" id="loginBackdrop">
    <div class="modal">
        <button class="modal-close" id="loginClose">&times;</button>
        <h3 id="loginTitle">Sign In</h3>
        <input class="login-input" type="text" placeholder="Username">
        <input class="login-input" type="password" placeholder="Password">
        <button class="btn btn-play">Submit</button>
    </div>
</div>

<script>
/* Generate tiles */
function addItems(row, label, color) {
    for (let i = 1; i <= 10; i++) {
        const div = document.createElement('div');
        div.className = 'item';
        div.style.background = color;
        div.textContent = `${label} ${i}`;
        div.onclick = () => openModal(label, i, color);
        row.appendChild(div);
    }
}

addItems(document.getElementById('shortsRow'), 'Short', '#b00000');
addItems(document.getElementById('showsRow'), 'Show', '#444');
addItems(document.getElementById('forYouRow'), 'For You', '#222');

/* Modal logic */
const modalBackdrop = document.getElementById('modalBackdrop');
const modalClose = document.getElementById('modalClose');
const modalDesc = document.getElementById('modalDesc');
const modalActions = document.getElementById('modalActions');
const modalThumb = document.getElementById('modalThumb');

function openModal(label, number, color) {
    modalDesc.textContent = `${label} ${number} — Description goes here.`;
    modalThumb.style.background = color;
    modalActions.style.display = 'none';
    modalDesc.style.display = 'block';
    modalBackdrop.style.display = 'flex';
}

modalClose.onclick = () => modalBackdrop.style.display = 'none';

modalDesc.onclick = () => {
    modalDesc.style.display = 'none';
    modalActions.style.display = 'block';
};

modalThumb.onclick = () => {
    modalActions.style.display = 'none';
    modalDesc.style.display = 'block';
};

/* Search bar */
document.getElementById("searchBar").addEventListener("input", function() {
    const q = this.value.toLowerCase();
    document.querySelectorAll(".item").forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(q) ? "flex" : "none";
    });
});

/* Login modal */
const loginBackdrop = document.getElementById('loginBackdrop');
const loginClose = document.getElementById('loginClose');
const loginTitle = document.getElementById('loginTitle');

document.getElementById('signInBtn').onclick = () => {
    loginTitle.textContent = "Sign In";
    loginBackdrop.style.display = 'flex';
};

document.getElementById('createAccountBtn').onclick = () => {
    loginTitle.textContent = "Create Account";
    loginBackdrop.style.display = 'flex';
};

loginClose.onclick = () => loginBackdrop.style.display = 'none';
</script>

</body>
</html>
