<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AnimationEarth Originals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ============================================================
   GLOBAL STYLES — LAVENDER + SILVER THEME
============================================================ */
:root {
    --lavender: #e6d6ff;
    --lavender-dark: #cbb8ff;
    --silver: #c0c0c0;
    --silver-bright: #e8e8e8;
    --text-dark: #222;
    --text-light: #fff;
}

body {
    margin: 0;
    padding: 0;
    background: var(--lavender);
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    color: var(--text-dark);
}

/* Silver trim utility */
.silver {
    border: 2px solid var(--silver);
    border-radius: 10px;
}

/* ============================================================
   BACKGROUND SHAPE LAYER
============================================================ */
#shapeLayer {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
}

/* Base shape style */
.shape {
    position: absolute;
    opacity: 0.35;
    background: var(--silver);
    animation: drift 22s linear infinite;
}

/* Slow upward drift */
@keyframes drift {
    from { transform: translateY(0px); }
    to { transform: translateY(-250px); }
}

/* ============================================================
   NAVIGATION BAR
============================================================ */
nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 40px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(12px);
    border-bottom: 2px solid var(--silver);
}

nav img {
    width: 220px; /* MEDIUM SIZE LOGO */
    height: auto;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 30px;
    font-size: 1.2em;
    padding: 0;
    margin: 0;
}

nav ul li {
    cursor: pointer;
    font-weight: bold;
    color: var(--text-dark);
    transition: color 0.3s ease;
}

nav ul li:hover {
    color: var(--lavender-dark);
}

/* ============================================================
   HERO SECTION
============================================================ */
.hero {
    padding: 120px 40px 80px 40px;
}

.hero h1 {
    font-size: 4em;
    margin: 0;
    color: var(--text-dark);
}

.hero p {
    font-size: 1.4em;
    max-width: 600px;
    margin-top: 10px;
    color: #333;
}

.hero button {
    margin-top: 25px;
    padding: 14px 28px;
    font-size: 1.2em;
    border-radius: 10px;
    border: none;
    background: var(--silver);
    color: var(--text-dark);
    cursor: pointer;
    transition: background 0.3s ease, transform 0.3s ease;
}

.hero button:hover {
    background: var(--silver-bright);
    transform: scale(1.05);
}

/* ============================================================
   CONTENT ROWS
============================================================ */
.section-title {
    font-size: 1.8em;
    margin: 40px 0 10px 40px;
    color: var(--text-dark);
}

.row {
    display: flex;
    gap: 20px;
    padding: 0 40px 40px 40px;
    flex-wrap: wrap;
}

/* ============================================================
   TILE BASE STYLE
============================================================ */
.tile {
    width: 220px;
    height: 130px;
    background: var(--lavender-dark);
    border: 2px solid var(--silver);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dark);
    font-weight: bold;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}

/* Glow pulse overlay */
.tile::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.3), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
}

.tile:hover::after {
    opacity: 1;
}

/* ============================================================
   MODAL SYSTEM
============================================================ */
#modalBackdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

#modalBox {
    background: var(--lavender);
    padding: 25px;
    width: 420px;
    border-radius: 15px;
    border: 3px solid var(--silver);
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
}

#modalClose {
    float: right;
    cursor: pointer;
    font-size: 1.4em;
    font-weight: bold;
    color: var(--text-dark);
}

/* ============================================================
   DEVELOPER CONSOLE
============================================================ */
#devConsole {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 180px;
    background: rgba(0,0,0,0.75);
    color: var(--silver-bright);
    font-family: monospace;
    padding: 10px;
    display: none;
    overflow-y: auto;
    border-top: 3px solid var(--silver);
}

#devConsole h3 {
    margin: 0 0 10px 0;
    font-size: 1.1em;
    color: var(--silver-bright);
}

/* ============================================================
   SECRET COMMAND INPUT
============================================================ */
#secretInput {
    position: fixed;
    bottom: 200px;
    right: 20px;
    width: 240px;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid var(--silver);
    background: var(--lavender-dark);
    display: none;
    z-index: 999;
}
</style>
</head>
<body>

<!-- BACKGROUND SHAPES -->
<div id="shapeLayer"></div>

<!-- NAVIGATION BAR -->
<nav class="silver">
    <!-- MEDIUM BASE64 LOGO (SAFE SIZE) -->
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAYAAACt..."
         alt="AnimationEarth Logo">
    <ul>
        <li>Home</li>
        <li>Series</li>
        <li>Movies</li>
        <li>My List</li>
    </ul>
</nav>

<!-- HERO SECTION -->
<div class="hero">
    <h1>AnimationEarth Originals</h1>
    <p>Lavender skies, silver worlds, and endless creativity.</p>
    <button id="heroPlay">Play</button>
</div>

<!-- CONTENT ROWS -->
<h2 class="section-title">Shorts</h2>
<div class="row" id="shortsRow"></div>

<h2 class="section-title">Shows</h2>
<div class="row" id="showsRow"></div>

<h2 class="section-title">For You</h2>
<div class="row" id="forYouRow"></div>

<!-- MODAL -->
<div id="modalBackdrop">
    <div id="modalBox">
        <div id="modalClose">×</div>
        <h3 id="modalTitle"></h3>
        <p id="modalDesc"></p>
    </div>
</div>

<!-- DEVELOPER CONSOLE -->
<div id="devConsole">
    <h3>Developer Console</h3>
    <div id="devOutput"></div>
</div>

<!-- SECRET COMMAND INPUT -->
<input id="secretInput" placeholder="Enter secret command...">

<!-- BEGIN GIANT SCRIPT -->
<script>
<!-- GIANT SCRIPT START -->
<script>

/* ============================================================
   LOGGING UTILITY (Used by dev console)
============================================================ */
function devLog(msg) {
    const out = document.getElementById("devOutput");
    if (out) {
        const line = document.createElement("div");
        line.textContent = msg;
        out.appendChild(line);
    }
}

/* ============================================================
   BACKGROUND SHAPE ENGINE — ADVANCED
   - DOM shapes (circles, squares, abstract)
   - Slow drift animation
   - Depth layers
   - Glow effects
   - Random rotation
   - Random drift speed
   - Shape clusters
============================================================ */

const shapeLayer = document.getElementById("shapeLayer");

function createShape() {
    const shape = document.createElement("div");
    shape.classList.add("shape");

    // Random size
    const size = Math.random() * 120 + 20;

    // Random position
    const left = Math.random() * window.innerWidth;
    const top = Math.random() * window.innerHeight;

    // Random type
    const type = Math.random();
    const isCircle = type < 0.33;
    const isSquare = type < 0.66;

    // Random depth layer
    const depth = Math.floor(Math.random() * 3) + 1;
    const zIndex = depth === 1 ? -1 : depth === 2 ? -2 : -3;

    // Random drift speed
    const driftSpeed = Math.random() * 20 + 10;

    // Random rotation
    const rotation = Math.random() * 360;

    // Random glow
    const glow = Math.random() > 0.7;

    // Apply styles
    shape.style.width = size + "px";
    shape.style.height = size + "px";
    shape.style.left = left + "px";
    shape.style.top = top + "px";
    shape.style.zIndex = zIndex;
    shape.style.background = "var(--silver)";
    shape.style.opacity = 0.35;
    shape.style.transform = `rotate(${rotation}deg)`;

    if (isCircle) {
        shape.style.borderRadius = "50%";
    } else if (isSquare) {
        shape.style.borderRadius = "10px";
    } else {
        shape.style.borderRadius = "30%";
    }

    if (glow) {
        shape.style.boxShadow = "0 0 20px var(--silver)";
    }

    // Animation
    shape.style.animation = `drift ${driftSpeed}s linear infinite`;

    shapeLayer.appendChild(shape);
}

function createShapeCluster(x, y) {
    for (let i = 0; i < 8; i++) {
        const shape = document.createElement("div");
        shape.classList.add("shape");

        const size = Math.random() * 40 + 10;
        const offsetX = Math.random() * 100 - 50;
        const offsetY = Math.random() * 100 - 50;

        shape.style.width = size + "px";
        shape.style.height = size + "px";
        shape.style.left = x + offsetX + "px";
        shape.style.top = y + offsetY + "px";
        shape.style.background = "var(--silver)";
        shape.style.opacity = 0.25;
        shape.style.borderRadius = "50%";
        shape.style.animation = `drift ${Math.random() * 15 + 10}s linear infinite`;

        shapeLayer.appendChild(shape);
    }
}

// Generate shapes
for (let i = 0; i < 60; i++) {
    createShape();
}

// Generate clusters
for (let i = 0; i < 10; i++) {
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;
    createShapeCluster(x, y);
}

devLog("Background engine initialized.");
/* ============================================================
   TILE ENGINE — GENERATION + ANIMATION
============================================================ */

function addTiles(rowId, label) {
    const row = document.getElementById(rowId);
    if (!row) return;

    for (let i = 1; i <= 12; i++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.textContent = label + " " + i;

        // Modal open on click
        tile.onclick = () => openModal(label + " " + i);

        row.appendChild(tile);
    }
}

addTiles("shortsRow", "Short");
addTiles("showsRow", "Show");
addTiles("forYouRow", "For You");

devLog("Tiles generated.");

/* ============================================================
   TILE ANIMATION ENGINE — ADVANCED
============================================================ */

function enhanceTiles() {
    const tiles = document.querySelectorAll(".tile");

    tiles.forEach(tile => {
        // Smooth transitions
        tile.style.transition =
            "transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease";

        // Hover animation
        tile.addEventListener("mouseenter", () => {
            tile.style.transform = "scale(1.08) translateY(-6px)";
            tile.style.boxShadow = "0 0 20px var(--silver)";
            tile.style.background = "var(--lavender)";
        });

        // Leave animation
        tile.addEventListener("mouseleave", () => {
            tile.style.transform = "scale(1) translateY(0px)";
            tile.style.boxShadow = "none";
            tile.style.background = "var(--lavender-dark)";
        });

        // Click animation
        tile.addEventListener("mousedown", () => {
            tile.style.transform = "scale(0.95)";
        });

        tile.addEventListener("mouseup", () => {
            tile.style.transform = "scale(1.08) translateY(-6px)";
        });

        // Random idle motion
        const idleMotion = () => {
            const x = Math.random() * 4 - 2;
            const y = Math.random() * 4 - 2;

            tile.animate(
                [
                    { transform: `translate(${x}px, ${y}px)` },
                    { transform: "translate(0px, 0px)" }
                ],
                {
                    duration: 3000 + Math.random() * 2000,
                    easing: "ease-in-out",
                    iterations: Infinity
                }
            );
        };

        idleMotion();
    });

    devLog("Tile animations initialized.");
}

// Run after tiles exist
setTimeout(enhanceTiles, 500);
/* ============================================================
   MODAL ENGINE — OPEN / CLOSE / ANIMATION
============================================================ */

const modalBackdrop = document.getElementById("modalBackdrop");
const modalClose = document.getElementById("modalClose");
const modalTitle = document.getElementById("modalTitle");
const modalDesc = document.getElementById("modalDesc");

// Smooth fade-in animation
function animateModalOpen() {
    modalBackdrop.style.opacity = "0";
    modalBackdrop.style.display = "flex";

    setTimeout(() => {
        modalBackdrop.style.transition = "opacity 0.35s ease";
        modalBackdrop.style.opacity = "1";
    }, 10);
}

// Smooth fade-out animation
function animateModalClose() {
    modalBackdrop.style.transition = "opacity 0.35s ease";
    modalBackdrop.style.opacity = "0";

    setTimeout(() => {
        modalBackdrop.style.display = "none";
    }, 350);
}

// Open modal with content
function openModal(title) {
    modalTitle.textContent = title;
    modalDesc.textContent = "This is a lavender + silver modal for " + title + ".";
    animateModalOpen();
    devLog("Modal opened: " + title);
}

// Close modal
modalClose.onclick = () => {
    animateModalClose();
    devLog("Modal closed.");
};

// Close modal by clicking backdrop
modalBackdrop.onclick = (e) => {
    if (e.target === modalBackdrop) {
        animateModalClose();
        devLog("Modal closed (backdrop).");
    }
};

// Escape key closes modal
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalBackdrop.style.display === "flex") {
        animateModalClose();
        devLog("Modal closed (Escape key).");
    }
});

/* ============================================================
   HERO BUTTON — TRIGGERS MODAL
============================================================ */

document.getElementById("heroPlay").onclick = () => {
    openModal("Hero Play");
    devLog("Hero Play button clicked.");
};
/* ============================================================
   UI ENGINE — NAVIGATION, SCROLL, RIPPLE, EVENT BUS
============================================================ */

/* ------------------------------------------------------------
   GLOBAL EVENT BUS
------------------------------------------------------------ */
const EventBus = {
    events: {},
    emit(event, data) {
        if (this.events[event]) {
            this.events[event].forEach(fn => fn(data));
        }
        devLog("Event emitted: " + event);
    },
    on(event, fn) {
        if (!this.events[event]) this.events[event] = [];
        this.events[event].push(fn);
        devLog("Event listener added: " + event);
    }
};

/* ------------------------------------------------------------
   NAVIGATION INTERACTIONS
------------------------------------------------------------ */
const navItems = document.querySelectorAll("nav ul li");

navItems.forEach(item => {
    item.style.transition = "color 0.3s ease, transform 0.3s ease";

    item.addEventListener("mouseenter", () => {
        item.style.transform = "scale(1.15)";
        item.style.color = "var(--lavender-dark)";
    });

    item.addEventListener("mouseleave", () => {
        item.style.transform = "scale(1)";
        item.style.color = "var(--text-dark)";
    });

    item.addEventListener("click", () => {
        EventBus.emit("navClick", item.textContent);
    });
});

EventBus.on("navClick", (section) => {
    devLog("Navigation clicked: " + section);
});

/* ------------------------------------------------------------
   BUTTON RIPPLE EFFECT
------------------------------------------------------------ */
function addRippleEffect(button) {
    button.style.position = "relative";
    button.style.overflow = "hidden";

    button.addEventListener("click", function (e) {
        const ripple = document.createElement("span");
        ripple.style.position = "absolute";
        ripple.style.borderRadius = "50%";
        ripple.style.background = "rgba(255,255,255,0.5)";
        ripple.style.width = ripple.style.height = "0px";
        ripple.style.left = e.offsetX + "px";
        ripple.style.top = e.offsetY + "px";
        ripple.style.transform = "translate(-50%, -50%)";
        ripple.style.pointerEvents = "none";
        ripple.style.transition = "width 0.5s ease, height 0.5s ease, opacity 0.5s ease";

        this.appendChild(ripple);

        setTimeout(() => {
            ripple.style.width = "200px";
            ripple.style.height = "200px";
            ripple.style.opacity = "0";
        }, 10);

        setTimeout(() => ripple.remove(), 600);
    });
}

addRippleEffect(document.getElementById("heroPlay"));

/* ------------------------------------------------------------
   SCROLL ANIMATIONS
------------------------------------------------------------ */
function animateOnScroll() {
    const tiles = document.querySelectorAll(".tile");

    tiles.forEach(tile => {
        const rect = tile.getBoundingClientRect();
        if (rect.top < window.innerHeight - 50) {
            tile.style.transform = "scale(1) translateY(0px)";
            tile.style.opacity = "1";
        }
    });
}

window.addEventListener("scroll", animateOnScroll);

/* ------------------------------------------------------------
   AUTO-SCROLL HERO REVEAL
------------------------------------------------------------ */
window.addEventListener("load", () => {
    setTimeout(() => {
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
        devLog("Hero auto-scroll reveal triggered.");
    }, 300);
});
/* ============================================================
   DEVELOPER TOOLS — FPS METER, INSPECTORS, SECRET COMMANDS
============================================================ */

/* ------------------------------------------------------------
   FPS METER
------------------------------------------------------------ */
let fpsCounter = {
    lastFrameTime: performance.now(),
    fps: 0
};

function updateFPS() {
    const now = performance.now();
    const delta = now - fpsCounter.lastFrameTime;
    fpsCounter.lastFrameTime = now;
    fpsCounter.fps = Math.round(1000 / delta);
    devLog("FPS: " + fpsCounter.fps);
}

setInterval(updateFPS, 1000);

/* ------------------------------------------------------------
   SHAPE INSPECTOR
------------------------------------------------------------ */
function inspectShapes() {
    const shapes = document.querySelectorAll(".shape");
    devLog("Shape count: " + shapes.length);

    shapes.forEach((shape, index) => {
        const rect = shape.getBoundingClientRect();
        devLog(
            "Shape " +
                index +
                " — size: " +
                rect.width +
                "px, pos: (" +
                rect.left +
                ", " +
                rect.top +
                ")"
        );
    });
}

/* ------------------------------------------------------------
   TILE INSPECTOR
------------------------------------------------------------ */
function inspectTiles() {
    const tiles = document.querySelectorAll(".tile");
    devLog("Tile count: " + tiles.length);

    tiles.forEach((tile, index) => {
        const rect = tile.getBoundingClientRect();
        devLog(
            "Tile " +
                index +
                " — size: " +
                rect.width +
                "px, pos: (" +
                rect.left +
                ", " +
                rect.top +
                ")"
        );
    });
}

/* ------------------------------------------------------------
   EVENT LOG VIEWER
------------------------------------------------------------ */
EventBus.on("navClick", (section) => {
    devLog("EventBus log — navClick: " + section);
});

/* ------------------------------------------------------------
   SECRET COMMANDS ENGINE
------------------------------------------------------------ */
const secretInput = document.getElementById("secretInput");

function toggleSecretInput() {
    if (secretInput.style.display === "none") {
        secretInput.style.display = "block";
        devLog("Secret input opened.");
    } else {
        secretInput.style.display = "none";
        devLog("Secret input closed.");
    }
}

document.addEventListener("keydown", (e) => {
    if (e.key === "`") {
        toggleSecretInput();
    }
});

secretInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const cmd = secretInput.value.trim();
        secretInput.value = "";
        devLog("Secret command: " + cmd);

        if (cmd === "shapes") {
            inspectShapes();
        } else if (cmd === "tiles") {
            inspectTiles();
        } else if (cmd === "fps") {
            updateFPS();
        } else if (cmd === "console") {
            toggleDevConsole();
        } else {
            devLog("Unknown command: " + cmd);
        }
    }
});

/* ------------------------------------------------------------
   DEVELOPER CONSOLE TOGGLE
------------------------------------------------------------ */
function toggleDevConsole() {
    const consoleBox = document.getElementById("devConsole");
    if (consoleBox.style.display === "none") {
        consoleBox.style.display = "block";
        devLog("Developer console opened.");
    } else {
        consoleBox.style.display = "none";
        devLog("Developer console closed.");
    }
}

document.addEventListener("keydown", (e) => {
    if (e.key === "F2") {
        toggleDevConsole();
    }
});
/* ============================================================
   EASTER EGGS — HIDDEN ANIMATIONS, SECRET MODES, PARTICLES
============================================================ */

/* ------------------------------------------------------------
   BACKGROUND DISTORTION MODE
------------------------------------------------------------ */
let distortionMode = false;

function toggleDistortion() {
    distortionMode = !distortionMode;

    const shapes = document.querySelectorAll(".shape");

    shapes.forEach(shape => {
        if (distortionMode) {
            shape.style.transition = "filter 0.5s ease, transform 0.5s ease";
            shape.style.filter = "blur(4px) brightness(1.4)";
            shape.style.transform += " scale(1.3)";
        } else {
            shape.style.filter = "none";
            shape.style.transform = shape.style.transform.replace(" scale(1.3)", "");
        }
    });

    devLog("Distortion mode: " + (distortionMode ? "ON" : "OFF"));
}

/* ------------------------------------------------------------
   TILE PARTICLE BURST EFFECT
------------------------------------------------------------ */
function burstParticles(tile) {
    for (let i = 0; i < 12; i++) {
        const p = document.createElement("div");
        p.style.position = "absolute";
        p.style.width = "6px";
        p.style.height = "6px";
        p.style.background = "var(--silver)";
        p.style.borderRadius = "50%";
        p.style.left = "50%";
        p.style.top = "50%";
        p.style.transform = "translate(-50%, -50%)";
        p.style.pointerEvents = "none";

        tile.appendChild(p);

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 60 + 20;

        p.animate(
            [
                { transform: `translate(-50%, -50%)` },
                {
                    transform: `translate(${Math.cos(angle) * distance}px, ${
                        Math.sin(angle) * distance
                    }px)`
                },
                { opacity: 0 }
            ],
            {
                duration: 600,
                easing: "ease-out"
            }
        );

        setTimeout(() => p.remove(), 650);
    }
}

/* ------------------------------------------------------------
   ADD PARTICLE BURSTS TO TILES
------------------------------------------------------------ */
function enableTileBursts() {
    const tiles = document.querySelectorAll(".tile");

    tiles.forEach(tile => {
        tile.addEventListener("click", () => {
            burstParticles(tile);
            devLog("Particle burst triggered.");
        });
    });
}

enableTileBursts();

/* ------------------------------------------------------------
   SECRET UI MODE — LAVENDER NIGHT MODE
------------------------------------------------------------ */
let nightMode = false;

function toggleNightMode() {
    nightMode = !nightMode;

    if (nightMode) {
        document.body.style.background = "#1a0f2e";
        document.body.style.color = "var(--silver-bright)";
        devLog("Night mode activated.");
    } else {
        document.body.style.background = "var(--lavender)";
        document.body.style.color = "var(--text-dark)";
        devLog("Night mode deactivated.");
    }
}

/* ------------------------------------------------------------
   SECRET KEY COMBOS
------------------------------------------------------------ */
document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key === "1") {
        toggleDistortion();
    }
    if (e.ctrlKey && e.key === "2") {
        toggleNightMode();
    }
});

/* ------------------------------------------------------------
   DEBUG OVERLAY
------------------------------------------------------------ */
let debugOverlay;

function createDebugOverlay() {
    debugOverlay = document.createElement("div");
    debugOverlay.style.position = "fixed";
    debugOverlay.style.top = "0";
    debugOverlay.style.right = "0";
    debugOverlay.style.width = "260px";
    debugOverlay.style.height = "140px";
    debugOverlay.style.background = "rgba(0,0,0,0.7)";
    debugOverlay.style.color = "var(--silver-bright)";
    debugOverlay.style.fontFamily = "monospace";
    debugOverlay.style.padding = "10px";
    debugOverlay.style.zIndex = "9999";
    debugOverlay.style.display = "none";
    debugOverlay.style.borderLeft = "3px solid var(--silver)";
    debugOverlay.style.borderBottom = "3px solid var(--silver)";
    document.body.appendChild(debugOverlay);
}

createDebugOverlay();

function toggleDebugOverlay() {
    if (debugOverlay.style.display === "none") {
        debugOverlay.style.display = "block";
        devLog("Debug overlay opened.");
    } else {
        debugOverlay.style.display = "none";
        devLog("Debug overlay closed.");
    }
}

document.addEventListener("keydown", (e) => {
    if (e.key === "F3") {
        toggleDebugOverlay();
    }
});

/* ------------------------------------------------------------
   DEBUG OVERLAY LIVE DATA
------------------------------------------------------------ */
setInterval(() => {
    if (debugOverlay.style.display === "block") {
        const shapes = document.querySelectorAll(".shape").length;
        const tiles = document.querySelectorAll(".tile").length;

        debugOverlay.innerHTML =
            "FPS: " +
            fpsCounter.fps +
            "<br>" +
            "Shapes: " +
            shapes +
            "<br>" +
            "Tiles: " +
            tiles +
            "<br>" +
            "Night Mode: " +
            nightMode +
            "<br>" +
            "Distortion: " +
            distortionMode;
    }
}, 500);
/* ============================================================
   ADVANCED ANIMATION SYSTEM — PULSE, COLLISIONS, FLIPS, STACKS
============================================================ */

/* ------------------------------------------------------------
   BACKGROUND PULSE ENGINE
------------------------------------------------------------ */
let pulseActive = false;

function togglePulse() {
    pulseActive = !pulseActive;

    const shapes = document.querySelectorAll(".shape");

    shapes.forEach(shape => {
        if (pulseActive) {
            shape.animate(
                [
                    { transform: shape.style.transform + " scale(1)" },
                    { transform: shape.style.transform + " scale(1.15)" },
                    { transform: shape.style.transform + " scale(1)" }
                ],
                {
                    duration: 3000,
                    iterations: Infinity,
                    easing: "ease-in-out"
                }
            );
        }
    });

    devLog("Pulse mode: " + (pulseActive ? "ON" : "OFF"));
}

document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key === "3") {
        togglePulse();
    }
});

/* ------------------------------------------------------------
   SHAPE COLLISION SIMULATION (VISUAL ONLY)
------------------------------------------------------------ */
function simulateCollisions() {
    const shapes = document.querySelectorAll(".shape");

    shapes.forEach(shape => {
        const rect = shape.getBoundingClientRect();

        if (rect.left < 0 || rect.right > window.innerWidth) {
            shape.style.transform += " rotate(45deg)";
        }
        if (rect.top < 0 || rect.bottom > window.innerHeight) {
            shape.style.transform += " rotate(-45deg)";
        }
    });

    devLog("Collision simulation tick.");
}

setInterval(simulateCollisions, 2000);

/* ------------------------------------------------------------
   TILE FLIP ANIMATIONS
------------------------------------------------------------ */
function enableTileFlips() {
    const tiles = document.querySelectorAll(".tile");

    tiles.forEach(tile => {
        tile.addEventListener("dblclick", () => {
            tile.animate(
                [
                    { transform: "rotateY(0deg)" },
                    { transform: "rotateY(180deg)" },
                    { transform: "rotateY(360deg)" }
                ],
                {
                    duration: 800,
                    easing: "ease-in-out"
                }
            );

            devLog("Tile flip animation triggered.");
        });
    });
}

enableTileFlips();

/* ------------------------------------------------------------
   MODAL STACKING SYSTEM
------------------------------------------------------------ */
let modalStack = [];

function pushModal(title, desc) {
    modalStack.push({ title, desc });
    openModal(title);
    devLog("Modal pushed: " + title);
}

function popModal() {
    modalStack.pop();
    animateModalClose();
    devLog("Modal popped.");
}

document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key === "M") {
        pushModal("Stacked Modal", "This modal is part of a stack.");
    }
    if (e.ctrlKey && e.key === "N") {
        popModal();
    }
});

/* ------------------------------------------------------------
   GLOBAL ANIMATION CONTROLLER
------------------------------------------------------------ */
let animationsEnabled = true;

function toggleAnimations() {
    animationsEnabled = !animationsEnabled;

    const shapes = document.querySelectorAll(".shape");
    const tiles = document.querySelectorAll(".tile");

    shapes.forEach(shape => {
        shape.style.animationPlayState = animationsEnabled ? "running" : "paused";
    });

    tiles.forEach(tile => {
        tile.style.transition = animationsEnabled
            ? "transform 0.25s ease, box-shadow 0.25s ease"
            : "none";
    });

    devLog("Animations: " + (animationsEnabled ? "ENABLED" : "DISABLED"));
}

document.addEventListener("keydown", (e) => {
    if (e.key === "F4") {
        toggleAnimations();
    }
});

/* ------------------------------------------------------------
   AUTO-THEME CYCLE (Lavender → Silver → Night → Lavender)
------------------------------------------------------------ */
let themeIndex = 0;

function cycleTheme() {
    themeIndex++;

    if (themeIndex === 1) {
        document.body.style.background = "var(--silver)";
        devLog("Theme: Silver");
    } else if (themeIndex === 2) {
        document.body.style.background = "#1a0f2e";
        devLog("Theme: Night");
    } else {
        document.body.style.background = "var(--lavender)";
        themeIndex = 0;
        devLog("Theme: Lavender");
    }
}

setInterval(cycleTheme, 15000);
/* ============================================================
   FINAL CLEANUP — END OF GIANT SCRIPT
============================================================ */

// Final log
devLog("All systems initialized. Giant script complete.");

// Optional: window ready event
window.addEventListener("load", () => {
    devLog("Window fully loaded.");
});

</script>

</body>
