<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimationEarth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg">
    <div class="overlay">

        <div class="top-buttons">
            <button id="createAccountBtn">Create Account</button>
            <button id="signInBtn">Sign In</button>
        </div>

        <header>
            <img src="assets/logos/logo.png" alt="Logo">
        </header>

        <input type="text" id="searchBar" placeholder="Search...">

        <!-- ORDER OF SECTIONS (you can rearrange these) -->
        <section id="shortsSection">
            <h2>Shorts</h2>
            <div class="scroll-box" id="shortsRow"></div>
        </section>

        <section id="showsSection">
            <h2>Shows</h2>
            <div class="scroll-box" id="showsRow"></div>
        </section>

        <section id="forYouSection">
            <h2>For You</h2>
            <div class="scroll-box" id="forYouRow"></div>
        </section>

    </div>
</div>

<!-- Content Modal -->
<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-thumb" id="modalThumb"></div>
        <div class="modal-desc" id="modalDesc"></div>
        <div class="modal-actions" id="modalActions">
            <button class="btn btn-play">Play</button>
            <button class="btn btn-trailer">Trailer</button>
            <button class="btn btn-rate">Rate ⭐</button>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div class="modal-backdrop" id="loginBackdrop">
    <div class="modal">
        <button class="modal-close" id="loginClose">&times;</button>
        <h3 id="loginTitle">Sign In</h3>
        <input class="login-input" type="text" placeholder="Username">
        <input class="login-input" type="password" placeholder="Password">
        <button class="btn btn-play">Submit</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
