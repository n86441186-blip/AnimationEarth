<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimationEarth</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #e6e6e6;
    }

    .bg {
        background: linear-gradient(135deg, #f5f5f5 0%, #f0e4ff 40%, #e3f7ff 80%);
        min-height: 100vh;
        padding: 20px;
    }

    .overlay {
        background: rgba(255,255,255,0.9);
        max-width: 1200px;
        margin: 0 auto;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        position: relative;
    }

    .top-buttons {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
    }

    .top-buttons a {
        background: #000;
        color: #fff;
        padding: 8px 14px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 0.9em;
    }

    header {
        text-align: center;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    header img {
        width: 200px;
        border-radius: 16px;
    }

    #searchBar {
        width: 90%;
        max-width: 500px;
        padding: 12px;
        margin: 20px auto;
        display: block;
        border-radius: 999px;
        border: 1px solid #ccc;
        font-size: 1em;
    }

    h2 {
        margin-top: 30px;
        margin-bottom: 10px;
        font-size: 1.4em;
        text-align: left;
    }

    .scroll-box {
        display: flex;
        overflow-x: auto;
        gap: 12px;
        padding-bottom: 10px;
    }

    .item {
        min-width: 160px;
        height: 100px;
        background: #000;
        border-radius: 18px;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 0.9em;
        text-align: center;
    }

    .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .modal {
        background: #fff;
        border-radius: 20px;
        max-width: 500px;
        width: 90%;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        position: relative;
    }

    .modal-close {
        position: absolute;
        top: 10px;
        right: 10px;
        border: none;
        background: transparent;
        font-size: 1.2em;
        cursor: pointer;
    }

    .modal-thumb {
        width: 100%;
        height: 180px;
        border-radius: 18px;
        background: #000;
        margin-bottom: 15px;
        cursor: pointer;
    }

    .modal-actions {
        display: none;
    }

    .btn {
        display: block;
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-size: 0.95em;
    }

    .btn-play { background: #000; color: #fff; }
    .btn-trailer { background: #444; color: #fff; }
    .btn-rate { background: #ffd700; color: #000; }
</style>
</head>
<body>

<div class="bg">
    <div class="overlay">

        <div class="top-buttons">
            <a href="#">Create Account</a>
            <a href="#">Sign In</a>
        </div>

        <header>
            <img src="your-logo.png" alt="Logo">
        </header>

        <input type="text" id="searchBar" placeholder="Search...">

        <h2>Shorts</h2>
        <div class="scroll-box" id="shortsRow"></div>

        <h2>Shows</h2>
        <div class="scroll-box" id="showsRow"></div>

        <h2>For You</h2>
        <div class="scroll-box" id="forYouRow"></div>

    </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-thumb" id="modalThumb"></div>
        <div class="modal-desc" id="modalDesc">Description goes here.</div>
        <div class="modal-actions" id="modalActions">
            <button class="btn btn-play">Play</button>
            <button class="btn btn-trailer">Trailer</button>
            <button class="btn btn-rate">Rate ⭐</button>
        </div>
    </div>
</div>

<script>
    const shortsRow = document.getElementById('shortsRow');
    const showsRow = document.getElementById('showsRow');
    const forYouRow = document.getElementById('forYouRow');

    function addItems(row, label) {
        for (let i = 1; i <= 10; i++) {
            const div = document.createElement('div');
            div.className = 'item';
            div.textContent = `${label} ${i}`;
            div.onclick = () => openModal(`${label} ${i}`);
            row.appendChild(div);
        }
    }

    addItems(shortsRow, 'Short');
    addItems(showsRow, 'Show');
    addItems(forYouRow, 'For You');

    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalClose = document.getElementById('modalClose');
    const modalDesc = document.getElementById('modalDesc');
    const modalActions = document.getElementById('modalActions');
    const modalThumb = document.getElementById('modalThumb');

    let showingActions = false;

    function openModal(name) {
        modalDesc.textContent = `Description for ${name}`;
        modalActions.style.display = 'none';
        modalDesc.style.display = 'block';
        showingActions = false;
        modalBackdrop.style.display = 'flex';
    }

    modalClose.onclick = () => modalBackdrop.style.display = 'none';

    modalDesc.onclick = () => {
        modalDesc.style.display = 'none';
        modalActions.style.display = 'block';
        showingActions = true;
    };

    modalThumb.onclick = () => {
        modalActions.style.display = 'none';
        modalDesc.style.display = 'block';
        showingActions = false;
    };
</script>

</body>
</html>
